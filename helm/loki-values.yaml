# Lightweight Loki (single binary, filesystem storage) — log store for security events
# helm upgrade --install loki grafana/loki -n monitoring --create-namespace -f helm/loki-values.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h   # keep 7 days of security events

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

# Disable the scalable components (not needed for a lab)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
