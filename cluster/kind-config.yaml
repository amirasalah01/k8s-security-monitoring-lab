# Local Kubernetes cluster for the security monitoring lab
# Usage: kind create cluster --config cluster/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: secmon-lab
nodes:
  - role: control-plane
    extraPortMappings:
      # Grafana (NodePort 30300) -> http://localhost:3000
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # n8n (NodePort 30678) -> http://localhost:5678
      - containerPort: 30678
        hostPort: 5678
        protocol: TCP
      # Falcosidekick UI (NodePort 30282) -> http://localhost:2802
      - containerPort: 30282
        hostPort: 2802
        protocol: TCP
  - role: worker
